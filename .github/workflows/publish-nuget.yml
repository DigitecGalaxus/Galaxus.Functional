name: Publish NuGet Packages

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  build-and-publish:
    name: Build and Publish NuGet
    runs-on: ubuntu-latest
    permissions:
        contents: read
        id-token: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
    - name: Setup .NET
      uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3
      with:
        dotnet-version: 10.0
    - name: Extract Version from Tag
      run: echo "VERSION=${GITHUB_REF##*/}" >> $GITHUB_ENV
    - name: Install Dependencies
      run: dotnet restore
    - name: Build Solution
      run: |
        dotnet build --configuration Release \
          --no-restore \
          -p:CI_BUILD=true \
          -p:Version=${{env.VERSION}} \
          -p:PackageVersion=${{env.VERSION}} \
    - name: Pack NuGet Packages
      run: |
        dotnet pack --configuration Release \
          --no-build \
          -p:CI_BUILD=true \
          -p:Version=${{env.VERSION}} \
          -p:PackageVersion=${{env.VERSION}} \
          --output ./artifacts

    - name: Setup NuGet token
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
